// StarScenes (Fabric 1.21.11): NPCs animados desde modelos de Blockbench (.bbmodel). Propiedad de Starlevi.
plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Moldes minimos de la API de EMF (solo para compilar el gancho de gestos; no van en el jar: en el juego
// se usan las clases de verdad de EMF, si esta instalado)
sourceSets {
    emfstubs {
        compileClasspath += sourceSets.main.compileClasspath
    }
    main {
        compileClasspath += sourceSets.emfstubs.output
    }
}

// Prueba visual: abre el juego, pone un NPC de prueba y saca capturas (runClientGameTest)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "starscenes-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Para compilar afuera de Gradle: copia el classpath (Minecraft con nombres de Mojang + Fabric API) a build/cp
tasks.register('copiarClasspath', Copy) {
    from sourceSets.main.compileClasspath
    into layout.buildDirectory.dir('cp')
}

// En la prueba, que no espere a los servidores de Mojang (si andan lentos, el mundo no termina de cargar)
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    jvmArgs '-Dminecraft.api.session.host=http://127.0.0.1:9', '-Dminecraft.api.services.host=http://127.0.0.1:9',
            '-Dminecraft.api.auth.host=http://127.0.0.1:9', '-Dminecraft.api.account.host=http://127.0.0.1:9'
}
