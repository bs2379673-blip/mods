name: Compilar mods
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [efactions, saclothing, dancers, tacui, efzombies, bestialago, infectados, spawncontrol, interacciones, taaef]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar ${{ matrix.mod }}
        working-directory: ${{ matrix.mod }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "error:|\.java:[0-9]+: " build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: ${{ matrix.mod }}/build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
      - name: Publicar jars en la release "ultimo"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -R jars
          gh release delete ultimo --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create ultimo jars/*/*.jar -R "$GITHUB_REPOSITORY" --title "Ultimo build" --notes "Jars compilados automaticamente (commit $GITHUB_SHA)" --target "$GITHUB_SHA"
