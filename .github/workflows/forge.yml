name: Annis Forge 1.20.1
on:
  push:
    branches: [forge-1.20.1]
    paths: ['forge/**', '.github/workflows/forge.yml']
  workflow_dispatch:
    inputs:
      cp:
        description: 'volver a subir el classpath'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Bajar mods de Forge 1.20.1 para compilar
        id: dl
        run: |
          python3 forge/tools/bajar_mods.py forge/libs | tee dl.txt
          ls -la forge/libs
          echo "info=$(tr '\n' ' ' < dl.txt)" >> $GITHUB_OUTPUT
      - name: Classpath (para compilar rapido afuera)
        working-directory: forge
        run: |
          gradle dumpClasspath --no-daemon --stacktrace 2>&1 | tee ../dump.log | tail -40
          mkdir -p ../cp && cp annisnpc/build/cp/*.jar annisvfx/build/cp/*.jar ../cp/ 2>/dev/null || true
          cp libs/*.jar ../cp/ || true
          ls ../cp | head -80; du -sh ../cp
      - name: Publicar classpath (release forge-ci)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view forge-ci -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create forge-ci -R "$GITHUB_REPOSITORY" --prerelease --title "Forge CI (interno)" --notes "Archivos internos para compilar la version Forge 1.20.1" --target "$GITHUB_SHA"
          size=$(gh release view forge-ci -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | select(.name=="cp.tgz") | .size')
          if [ -z "$size" ] || [ "$size" -lt 50000000 ] || [ -n "${{ github.event.inputs.cp }}" ]; then
            tar czf cp.tgz cp && gh release upload forge-ci cp.tgz --clobber -R "$GITHUB_REPOSITORY"
          fi
      - name: Compilar
        working-directory: forge
        run: |
          set -o pipefail
          gradle build --no-daemon --continue 2>&1 | tee build.log || {
            grep -E "error:|What went wrong|FAILED|Execution failed" -A3 build.log | head -80
            exit 1
          }
      - name: Jars finales y paquete de animaciones
        run: |
          mkdir -p out
          for m in annisnpc annisinteract annisvfx; do cp forge/$m/build/libs/$m-forge-1.20.1-*.jar out/; done
          rm -f out/*-sources.jar out/*-dev.jar
          mkdir -p bake/cls
          javac -d bake/cls $(find annisinteract/src/main/java/com/annis/interact/client/anim -name "*.java") annisinteract/src/main/java/com/annis/interact/Layout.java annisinteract/src/main/java/com/annis/interact/Touch.java annisinteract/tools/BakeAnims.java
          java -cp bake/cls BakeAnims bake/pack
          python3 - <<'EOP'
          import json
          p = 'bake/pack/pack.mcmeta'
          d = json.load(open(p))
          d['pack']['pack_format'] = 15
          json.dump(d, open(p, 'w'), indent=2)
          EOP
          (cd bake/pack && zip -q -r ../../out/Annis_Animaciones.zip .)
          cp forge/LEEME_FORGE.txt out/ 2>/dev/null || true
          ls -la out
      - name: Publicar en la release "annis-forge-1.20.1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete annis-forge-1.20.1 --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          for i in 1 2 3 4; do
            if gh release create annis-forge-1.20.1 out/* -R "$GITHUB_REPOSITORY" --title "Annis (Forge 1.20.1)" --notes "Annis NPC, Annis Interacciones y Annis VFX para Forge 1.20.1 (commit $GITHUB_SHA). Necesitan playerAnimator para Forge 1.20.1." --target "$GITHUB_SHA" > rel.txt 2>&1; then cat rel.txt; break; fi
            while read -r l; do echo "::warning::release intento $i> $l"; done < rel.txt
            sleep 15
          done
      - name: Prueba visual (servidor Forge + cliente en pantalla virtual)
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          mkdir -p vis
          bash forge/ci/visual.sh > vis/visual-out.txt 2>&1
          tail -40 vis/visual-out.txt
          cp forge/visrun/install.log vis/ 2>/dev/null; ls -la forge/visrun > vis/visrun-ls.txt 2>&1
          cp forge/visrun/server.log vis/server.log 2>/dev/null; cp forge/run/logs/latest.log vis/client.log 2>/dev/null; cp forge/client.log vis/client-gradle.log 2>/dev/null; cp forge/rcon-visual.txt vis/ 2>/dev/null
          cp out/visual/*.png vis/ 2>/dev/null; cp forge/run/screenshots/*.png vis/ 2>/dev/null; cp out/jstack.txt vis/ 2>/dev/null
          ls -la vis
          tar czf vis.tgz vis && gh release upload forge-ci vis.tgz --clobber -R "$GITHUB_REPOSITORY"
      - name: Publicar log y jars (release forge-ci)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp forge/build.log build.log 2>/dev/null || echo "sin log" > build.log
          echo "${{ steps.dl.outputs.info }}" >> build.log
          cat dump.log >> build.log 2>/dev/null || true
          gh release upload forge-ci build.log --clobber -R "$GITHUB_REPOSITORY"
          for j in forge/*/build/libs/*-forge-1.20.1-*.jar; do [ -f "$j" ] && gh release upload forge-ci "$j" --clobber -R "$GITHUB_REPOSITORY"; done; true
