name: Compilar Annis NPC (Fabric 1.21.1)
on:
  push:
    branches: [annisnpc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annisnpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compilar annisnpc
        working-directory: annisnpc
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "error:|What went wrong|FAILED|Execution failed|Could not|Caused by|warning: \[" -A3 build.log | head -80 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
      - name: Elegir el jar final
        run: |
          mkdir -p out
          cp annisnpc/build/libs/annisnpc-*.jar out/
          rm -f out/*-sources.jar out/*-dev.jar
          ls -la out
          test -n "$(ls out/*.jar 2>/dev/null)"
      - name: Compilar Annis Interacciones
        working-directory: annisinteract
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "error:|What went wrong|FAILED|Execution failed|Could not|Caused by|warning: \[" -A3 build.log | head -80 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
          mkdir -p ../out2
          cp build/libs/annisinteract-*.jar ../out2/
          rm -f ../out2/*-sources.jar ../out2/*-dev.jar
          ls -la ../out2
      - uses: actions/upload-artifact@v4
        with:
          name: annisnpc
          path: |
            out/*.jar
            out2/*.jar
      - name: Publicar en la release "annisnpc-fabric-1.21.1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete annisnpc-fabric-1.21.1 --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create annisnpc-fabric-1.21.1 out/*.jar -R "$GITHUB_REPOSITORY" --title "Annis NPC (Fabric 1.21.1)" --notes "Annis NPC compilado automaticamente (commit $GITHUB_SHA). Requiere Fabric API y playerAnimator (viene dentro de Emotecraft)." --target "$GITHUB_SHA"
          gh release delete annisinteract-fabric-1.21.1 --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create annisinteract-fabric-1.21.1 out2/*.jar -R "$GITHUB_REPOSITORY" --title "Annis Interacciones (Fabric 1.21.1)" --notes "Annis Interacciones compilado automaticamente (commit $GITHUB_SHA). Requiere Annis NPC 0.11+, Fabric API y playerAnimator." --target "$GITHUB_SHA"
          cp out2/*.jar out/
      - name: Prueba de humo del servidor (carga, comandos, NPC)
        continue-on-error: true
        timeout-minutes: 15
        run: bash annisnpc/ci/servertest.sh
      - name: Prueba con Minecraft Comes Alive (servidor real)
        continue-on-error: true
        timeout-minutes: 12
        run: bash annisnpc/ci/mcatest.sh
      - name: Prueba visual (cliente en pantalla virtual)
        continue-on-error: true
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          bash annisinteract/ci/visual.sh
          if ls out/visual/*.png > /dev/null 2>&1; then
            cd out/visual && zip -q ../visual.zip *.png && cd ../..
            gh release delete annis-visual-test --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
            gh release create annis-visual-test out/visual.zip out/visual/*.png -R "$GITHUB_REPOSITORY" --prerelease --title "Prueba visual" --notes "Fotos automaticas (commit $GITHUB_SHA)" --target "$GITHUB_SHA"
          fi
