name: Migrar nombres a Mojang (para Forge 1.20.1)
on:
  push:
    branches: [forge-1.20.1]
    paths: ['.github/workflows/migrar-mojmap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Annis NPC -> nombres de Mojang
        working-directory: annisnpc
        run: |
          gradle migrateMappings --mappings "net.minecraft:mappings:1.21.1" --no-daemon --stacktrace 2>&1 | tail -30
          ls remappedSrc | head
      - name: Annis Interacciones (necesita annisnpc compilado)
        run: |
          (cd annisnpc && gradle build -x test --no-daemon -q 2>&1 | tail -5)
          cd annisinteract && gradle migrateMappings --mappings "net.minecraft:mappings:1.21.1" --no-daemon --stacktrace 2>&1 | tail -30
      - name: Annis VFX
        working-directory: annisvfx
        run: gradle migrateMappings --mappings "net.minecraft:mappings:1.21.1" --no-daemon --stacktrace 2>&1 | tail -30
      - name: Guardar el resultado en forge/<mod>/mojmap
        run: |
          for m in annisnpc annisinteract annisvfx; do
            if [ -d $m/remappedSrc ]; then
              rm -rf forge/$m/mojmap && mkdir -p forge/$m/mojmap && cp -r $m/remappedSrc/. forge/$m/mojmap/
            fi
          done
          find forge -name "*.java" | wc -l
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add forge
          git commit -m "Codigo con nombres de Mojang (automatico, base para Forge 1.20.1)" || echo "nada nuevo"
          git push
