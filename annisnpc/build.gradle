plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // playerAnimator de KosmX (MIT), la misma que trae Emotecraft 2.4.x para 1.21.1
    modImplementation files('libs/playeranimator-2.0.1+1.21.1.jar')

    // Minecraft Comes Alive (GPL-3.0, https://github.com/Luke100000/minecraft-comes-alive):
    // solo para compilar la integracion opcional; no se incluye en nuestro jar.
    modCompileOnly files('libs/mca-fabric-7.7.36-beta.3+1.21.1.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
